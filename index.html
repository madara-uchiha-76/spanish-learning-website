<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HolaLearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <h2>Hola<span>Learn</span></h2>
    <button onclick="scrollToLevels()">Start</button>
  </header>

  <!-- HERO -->
  <section class="hero">
    <p>🇪🇸 LEARN SPANISH</p>
    <h1>Spanish made <span>simple.</span></h1>
    <p>Interactive lessons from A1 to B2.</p>
    <button class="primary" onclick="scrollToLevels()">
      Start Learning →
    </button>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="levels">
    <h2>Choose Your Level</h2>

    <div class="level-grid">

      <div class="level-card" onclick="openLevel('A1')">
        <div>🌱</div>
        <h3>A1</h3>
        <p>Beginner</p>
        <small>40 Lessons</small>
      </div>

      <div class="level-card" onclick="openLevel('A2')">
        <div>📘</div>
        <h3>A2</h3>
        <p>Elementary</p>
        <small>40 Lessons</small>
      </div>

      <div class="level-card" onclick="openLevel('B1')">
        <div>🚀</div>
        <h3>B1</h3>
        <p>Intermediate</p>
        <small>50 Lessons</small>
      </div>

      <div class="level-card" onclick="openLevel('B2')">
        <div>🏆</div>
        <h3>B2</h3>
        <p>Upper Intermediate</p>
        <small>50 Lessons</small>
      </div>

    </div>
  </section>

  <!-- APP (Hidden First) -->
  <section id="app" class="app hidden">

    <div class="app-top">
      <h2 id="levelTitle">A1 Beginner</h2>
      <p id="progressText">0 / 40 Lessons</p>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div id="lessonList" class="lesson-list">
      <!-- JS create lessons -->
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
