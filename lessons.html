<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HolaLearn - Lessons</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        Hola<span>Learn</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#learn">
            Levels
        </a>

    </nav>

</header>


<main class="lessons-page">

    <div class="lessons-header">

        <span id="levelBadge">
            A1
        </span>

        <h1 id="levelTitle">
            A1 — Beginner
        </h1>

        <p id="levelDescription">
            Start your Spanish journey.
        </p>

    </div>


    <div
        id="lessonsContainer"
        class="lessons-container">
    </div>

</main>


<script src="lessons.js"></script>
    <!-- =========================================
     LESSON FILTER + SEARCH
========================================= -->

<div class="lesson-tools">

    <input
        type="text"
        id="lessonSearch"
        placeholder="Search lessons..."
        oninput="filterLessons()"
    >

    <select
        id="lessonFilter"
        onchange="filterLessons()">

        <option value="all">
            All Lessons
        </option>

        <option value="available">
            Available
        </option>

        <option value="completed">
            Completed
        </option>

    </select>

</div>


<!-- =========================================
     LESSON CONTENT AREA
========================================= -->

<div id="lessonExtraContent">

    <div class="lesson-tip">

        <span>💡</span>

        <div>

            <strong>Learning tip</strong>

            <p>
                Complete each lesson in order.
                Practice what you learn before moving forward.
            </p>

        </div>

    </div>

</div>

</body>

</html>
